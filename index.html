<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independence Day - Hacker Mode</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            font-size: 1.5rem;
            max-width: 90%;
            line-height: 1.5;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #0f0;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <span id="output"></span><span class="cursor"></span>
    </div>

    <script>
        const lines = [
            "root@india:~# sudo init independence_protocol",
            "> Loading modules... [OK]",
            "> Decrypting freedom key... [OK]",
            "> Target: India",
            "> Year: 2026",
            "> Status: UNRESTRICTED",
            "",
            "JAI HIND"
        ];

        let lineIndex = 0;
        let charIndex = 0;
        const output = document.getElementById("output");

        function typeWriter() {
            if (lineIndex < lines.length) {
                if (charIndex < lines[lineIndex].length) {
                    output.innerHTML += lines[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 50);
                } else {
                    output.innerHTML += "<br>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 600);
                }
            }
        }
        
        // Start typing after 1 second
        setTimeout(typeWriter, 1000);
    </script>
</body>
</html>
